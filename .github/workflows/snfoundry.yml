name: snfoundry
on:
  pull_request:
    branches:
      - "**"
    paths:
      - "**"
      - "!docs/*"
  push:
    branches:
      - "develop"
    paths:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: install, build and run snforge tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@ee00ea3f026379008ca40a54448d4059233d06cc # v4

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@22f50f68eb6ffacfc173786dab19aa7d49b43441 # v1
        with:
          scarb-lock: ./starknet-modular-account/Scarb.lock
          scarb-version: "2.9.3"

      - name: Run tests
        run: scarb test
