name: _ Reusable Typescript/Jest Workflow for SDKs

on:
  workflow_call:
    inputs:
      workspace:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      devnet:
        image: shardlabs/starknet-devnet-rs:0.2.4-seed0
        ports:
          - 5050:5050

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install starkli
        run: |
          curl -L https://github.com/xJonathanLEI/starkli/releases/download/v0.3.7/starkli-x86_64-unknown-linux-gnu.tar.gz -o starkli-x86_64-unknown-linux-gnu.tar.gz
          tar -zxvf starkli-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@22f50f68eb6ffacfc173786dab19aa7d49b43441 # v1
        with:
          scarb-lock: ./starknet-modular-account/Scarb.lock

      - name: Configure environment for devnet and seed=0
        run: cp .env.template.json .env.devnet.json

      - name: Build starknet contracts
        run: scarb build

      - name: declare starknet contracts
        run: ./declare-on-devnet.sh

      - name: build the project
        run: npm run build

      - name: Run jest tests
        run: npm run test -w ${{ inputs.workspace }}
